name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          gofmt -l . > "$RUNNER_TEMP/gofmt.txt"
          if [ -s "$RUNNER_TEMP/gofmt.txt" ]; then
            cat "$RUNNER_TEMP/gofmt.txt"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
